<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | FedEscape</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                <h1>FedEscape</h1>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- ================= REGISTER PAGE ================= -->

    <main>

        <section class="register-section">

            <div class="register-container">

                <h2>Create an Account</h2>

                <p>
                    Register as a teacher or student to join FedEscape.
                </p>

                <form id="registerForm">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6"
                        required>

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm your password" minlength="6" required>

                    <label for="userRole">
                        User Role
                    </label>

                    <select id="userRole" name="userRole" required>

                        <option value="" disabled selected>
                            Select your role
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                        <option value="student">
                            Student
                        </option>

                    </select>

                    <button class="btn primary-btn" type="submit">
                        Register
                    </button>

                </form>

                <p class="register-links">

                    Already have an account?

                    <a href="login.html">
                        Login Here
                    </a>

                </p>

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>



    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
