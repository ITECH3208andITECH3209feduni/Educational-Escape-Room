<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escape Room | FedEscape</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <!-- ==================================================
         NAVIGATION
    =================================================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                <h1>FedEscape</h1>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="../../dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="../../index.html">
                        Home
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ==================================================
         ESCAPE ROOM INTRODUCTION
    =================================================== -->

    <main class="game-page">

        <section class="mission-card">

            <!-- Category -->
            <p
                class="mission-label"
                id="missionLabel"
            >
                Loading Escape Room...
            </p>


            <!-- Room Name -->
            <h2 id="missionTitle">
                Loading...
            </h2>


            <!-- Mission Status -->
            <div
                class="mission-warning"
                id="missionWarning"
            >
                Mission Ready
            </div>


            <!-- Room Description -->
            <p
                class="mission-description"
                id="missionDescription"
            >
                Loading mission information...
            </p>


            <!-- ==================================================
                 ROOM INFORMATION
            =================================================== -->

            <div class="mission-details">

                <!-- Number of Questions -->
                <div class="mission-detail">

                    <strong id="missionQuestionCount">
                        -
                    </strong>

                    <span>
                        Challenges
                    </span>

                </div>


                <!-- Time Limit -->
                <div class="mission-detail">

                    <strong id="missionTime">
                        -
                    </strong>

                    <span>
                        Time limit
                    </span>

                </div>


                <!-- Difficulty -->
                <div class="mission-detail">

                    <strong id="missionDifficulty">
                        -
                    </strong>

                    <span>
                        Difficulty
                    </span>

                </div>

            </div>


            <!-- ==================================================
                 ROOM INSTRUCTIONS
            =================================================== -->

            <p
                class="mission-description"
                id="missionInstructions"
                hidden
            ></p>


            <!-- ==================================================
                 START BUTTON
            =================================================== -->

            <button
                id="startMissionButton"
                class="primary-btn"
                type="button"
                disabled
            >
                Loading Mission...
            </button>

        </section>

    </main>


    <!-- ==================================================
         FOOTER
    =================================================== -->

    <footer>

        <p>
            &copy; 2026 FedEscape
        </p>

        <p>
            Educational Escape Room Platform
        </p>

    </footer>


    <!-- ==================================================
         DYNAMIC MONGODB ROOM INTRODUCTION
    =================================================== -->

    <script src="../../js/config.js"></script>
    <script src="../../js/session.js"></script>
    <script src="../../js/intro.js"></script>


    <!-- ==================================================
         GAME LOGIC

         game.js handles the Start Mission button,
         creates/resumes the backend attempt and opens
         room.html.
    =================================================== -->

    <script src="../../js/game.js"></script>


</body>

</html>
