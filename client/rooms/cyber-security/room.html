<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Escape Room | FedEscape</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >
</head>


<body>

    <!-- ==================================================
         NAVIGATION
    =================================================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                <h1>FedEscape</h1>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="../../dashboard.html">
                        Dashboard
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ==================================================
         GAME
    =================================================== -->

    <main class="game-page">

        <section class="mission-card">


            <!-- ==================================================
                 GAME HUD
            =================================================== -->

            <div class="game-hud">

                <div class="hud-item">

                    📘

                    <span id="puzzleProgress">
                        Loading...
                    </span>

                </div>


                <div class="hud-item">

                    ⭐ Score:

                    <span id="currentScore">
                        0
                    </span>

                </div>


                <div class="hud-item">

                    ⏱

                    <span id="gameTimer">
                        --:--
                    </span>

                </div>

            </div>


            <!-- ==================================================
                 PROGRESS
            =================================================== -->

            <div class="progress-track">

                <div
                    id="progressFill"
                    class="progress-fill"
                    style="width: 0%;"
                >
                </div>

            </div>


            <p
                id="progressText"
                class="progress-text"
            >
                0% Complete
            </p>


            <!-- ==================================================
                 QUESTION
            =================================================== -->

            <p
                id="puzzleCategory"
                class="mission-label"
            >
                Loading Category...
            </p>


            <h2 id="puzzleTitle">
                Loading Challenge...
            </h2>


            <p
                id="puzzleQuestion"
                class="mission-description"
            >
                Loading question...
            </p>


            <!-- ==================================================
                 ANSWER FORM
            =================================================== -->

            <form id="puzzleForm">

                <div id="answerOptions">
                </div>


                <p
                    id="puzzleMessage"
                    class="puzzle-message"
                >
                </p>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Submit Answer
                </button>

            </form>


            <!-- ==================================================
                 COMPLETION SCREEN
            =================================================== -->

            <div
                id="completionScreen"
                hidden
            >

                <p class="mission-label">
                    Mission Complete
                </p>


                <!-- Dynamic room name -->
                <h2 id="completionTitle">
                    🎉 Mission Accomplished
                </h2>


                <!-- Dynamic MongoDB completion message -->
                <p
                    id="completionMessage"
                    class="mission-description"
                >
                    Mission completed successfully.
                </p>


                <!-- ==================================================
                     FINAL RESULTS
                =================================================== -->

                <div class="mission-details">


                    <!-- Final Score -->

                    <div class="mission-detail">

                        <strong id="finalScore">
                            0
                        </strong>

                        <span>
                            Final Score
                        </span>

                    </div>


                    <!-- Correct Answers -->

                    <div class="mission-detail">

                        <strong id="finalCorrectAnswers">
                            0 / 0
                        </strong>

                        <span>
                            Correct Answers
                        </span>

                    </div>


                    <!-- Time Remaining -->

                    <div class="mission-detail">

                        <strong id="finalTime">
                            --:--
                        </strong>

                        <span>
                            Time Remaining
                        </span>

                    </div>

                </div>


                <!-- ==================================================
                     COMPLETION ACTIONS
                =================================================== -->

                <div
                    style="
                        display: flex;
                        justify-content: center;
                        gap: 20px;
                        flex-wrap: wrap;
                        margin-top: 40px;
                    "
                >

                    <button
                        id="restartMissionButton"
                        type="button"
                        class="primary-btn"
                    >
                        Restart Mission
                    </button>


                    <a
                        href="../../dashboard.html"
                        class="primary-btn"
                    >
                        Return to Dashboard
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ==================================================
         JAVASCRIPT

         rooms.js is no longer needed.
         Room data comes from MongoDB through game.js.

         results.js is also not used to save completed
         game results anymore. The backend attempt system
         stores results in MongoDB.
    =================================================== -->


    <!-- Existing timer functionality -->
    <script src="../../js/timer.js"></script>


    <!-- Backend-integrated game -->
    <script src="../../js/game.js"></script>


</body>

</html>
